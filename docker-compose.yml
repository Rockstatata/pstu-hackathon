name: pstu-money

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money
    command: >
      postgres -c max_connections=200 -c log_lock_waits=on -c deadlock_timeout=1s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://money:money@db:5432/money
      JWT_SECRET: dev-secret-not-for-production
      LOCK_TIMEOUT_MS: "3000"
      CORS_ORIGINS: "http://localhost:3000"
      APP_ENVIRONMENT: development
      EXPECTED_REPLICAS: "3"
      CHAOS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 3
    volumes:
      - ./backend:/app
      - ./docs:/docs
    expose:
      - "8000"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "8080:80"

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://money:money@db:5432/money
      JWT_SECRET: dev-secret-not-for-production
      LOCK_TIMEOUT_MS: "3000"
      APP_ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  web:
    build: ./web
    profiles: ["web"]
    environment:
      # Read by web/src/lib/api.ts. The browser resolves this, not the container,
      # so it is the host-published gateway port rather than the compose service.
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  k6:
    image: grafana/k6:latest
    profiles: ["chaos"]
    volumes:
      - ./tests/k6:/scripts
    environment:
      BASE_URL: http://gateway/api/v1

volumes:
  dbdata:
