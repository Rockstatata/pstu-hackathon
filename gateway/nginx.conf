worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log off;

    # Docker's embedded DNS resolves `api` to all three replica IPs; nginx
    # round-robins across whichever are currently healthy.
    upstream api_pool {
        server api:8000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        # Which replica served the request — the integrity dashboard reads this
        # to prove traffic is actually spread across all three.
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A money write must never be silently replayed onto another replica
            # by the gateway. Retries are the client's job, guarded by the
            # Idempotency-Key. See docs/adr/0003 and the idempotency design.
            proxy_next_upstream off;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
