worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log off;

    # Docker's embedded DNS resolves `api` to all three replica IPs; nginx
    # round-robins across whichever are currently healthy.
    upstream api_pool {
        server api:8000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        # If a replica cannot answer because PostgreSQL disappeared, preserve the
        # public API contract instead of leaking nginx's HTML 502/504 page. The
        # wording is deliberately outcome-uncertain for money writes.
        proxy_intercept_errors on;
        error_page 502 504 =503 @financial_core_unavailable;

        location @financial_core_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"FINANCIAL_CORE_UNAVAILABLE","message":"The financial core is unavailable. The outcome may be unknown; check history before retrying with the same Idempotency-Key.","traceId":"-"}}';
        }

        # Which replica served this request. The integrity dashboard reads it to
        # prove traffic is genuinely spread across all three.
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Preserve the address supplied by Caddy, then append this hop.
            # The API only accepts the header from a configured proxy network
            # and parses the selected value as an IP before using it.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A money write must never be silently replayed onto another replica
            # by the gateway. Retrying is the client's job, guarded by the
            # Idempotency-Key. See docs/adr/0003.
            proxy_next_upstream off;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            # A valid group transfer can wait on several deterministically
            # ordered Account locks. Keep this above the database's per-lock
            # timeout so nginx does not abandon a request the API will safely
            # commit, then mark a healthy replica unavailable.
            proxy_read_timeout 15s;
        }
    }
}
